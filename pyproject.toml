[project]
name = "my-agent"
version = "0.1.0"
description = "Local macOS deep agent powered by LangChain Deep Agents and OpenRouter"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "deepagents>=0.6.8",
    "langchain>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-openrouter>=0.1.0",
    "langchain-tavily>=0.2.0",
    "langgraph>=0.3.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "typer>=0.12.0",
]

[project.scripts]
my-agent = "my_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/my_agent", "AGENTS.md", "config.toml.example", "skills"]
